name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
      - name: Validate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install mvdan.cc/garble@v0.17.0
      - run: garble -literals test ./...
      - run: python3 scripts/build-release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-files
          path: dist
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set the RELEASE_TOKEN repository secret to publish releases.'
            exit 1
          fi
          cd dist
          sha256sum -c checksums.txt
          cd ..
          printf 'Source: https://github.com/what1f/mylib/tree/%s\n' "$TAG" > release-notes.md
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --repo what1f/mylib-releases --target main --draft \
            --title "mylib $TAG" --notes-file release-notes.md
          gh release edit "$TAG" --repo what1f/mylib-releases --draft=false --latest
